[package]
name    = "symbolic"
version = "0.6.0"
entry   = "src/lib.vani"
authors = "enthusiasticgeek"
license = "MIT"
description = "Symbolic-math (CAS) foundation for vāṇी: flat-arena expression trees, numeric evaluation, precedence-aware pretty-printing, simplification (constant folding, identities, like-term collection), symbolic differentiation (sum/product/quotient/power+chain rules), equation solving (linear/quadratic, via vani-algebra), and polynomial integration (power/sum/constant-multiple rules plus linear u-substitution)."
registry = "kosh"

[deps]
# calculus: vendored via `vanic add calculus` for v0.3.0's tests/examples
# ONLY -- production sym_diff has zero calculus:: calls. Its
# diff_central is the numeric-differentiation reference tests/test_diff.vani
# cross-checks sym_diff's symbolic output against, matching this
# ecosystem's established pattern (e.g. vani-sparse vendors vani-matrix
# purely for its own cross-check tests, not production code).
#
# Num nodes still use plain i64 literals, not vani-bignum's BigInt,
# matching this ecosystem's narrow-then-widen precedent. The design
# leaves room to switch to a BigInt-backed side table later without
# changing ExprNode's shape (see src/lib.vani header).
calculus = { path = "./vendor/calculus", version = "^0.3.1" }

# algebra: vendored via `vanic add algebra` for v0.5.0 -- REAL production
# dependency (unlike calculus above), used by sym_solve_poly_le2 to solve
# the extracted [c0,c1,c2] coefficients via algebra::algebra_poly_roots_real
# (the same general real-root solver vani-algebra already has for linear/
# quadratic/cubic/quartic+, reused rather than reimplemented, per the
# roadmap's explicit call for this). Bumping this pulled in a version bump
# of vani-algebra itself (0.1.3 -> 0.1.4) upstream, to align algebra's own
# stale calculus ^0.2.0 pin with this package's ^0.3.1 -- vāṇी requires a
# single resolved version per package name across the whole dependency
# graph, so the two calculus requirements had to agree.
algebra = { path = "./vendor/algebra", version = "^0.1.4" }
