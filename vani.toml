[package]
name    = "symbolic"
version = "0.2.0"
entry   = "src/lib.vani"
authors = "enthusiasticgeek"
license = "MIT"
description = "Symbolic-math (CAS) foundation for vāṇी: flat-arena expression trees, numeric evaluation, precedence-aware pretty-printing, and simplification (constant folding, identities, like-term collection). Phases 1-2 of the planned symbolic-math tier -- no differentiation/integration yet."
registry = "kosh"

[deps]
# No external deps -- v0.1.0 uses plain i64 literals, not vani-bignum's
# BigInt, matching this ecosystem's narrow-then-widen precedent. The
# design leaves room to switch Num nodes to a BigInt-backed side table
# later without changing ExprNode's shape (see src/lib.vani header).
